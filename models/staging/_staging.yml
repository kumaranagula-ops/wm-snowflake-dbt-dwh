version: 2

models:
  # ---------------------------------------------------------------- CRM
  - name: stg_crm__branch
    description: Latest version of each branch.
    columns:
      - name: branch_id
        data_tests: [unique, not_null]

  - name: stg_crm__advisor
    description: Latest version of each advisor; first and last name combined into advisor_name.
    columns:
      - name: advisor_id
        data_tests: [unique, not_null]
      - name: branch_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_crm__branch'), field: branch_id}

  - name: stg_crm__client
    description: Latest version of each client (cleaned casing / whitespace).
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: risk_profile
        data_tests:
          - accepted_values:
              arguments: {values: ['CONSERVATIVE', 'MODERATE', 'AGGRESSIVE']}
      - name: segment
        data_tests:
          - accepted_values:
              arguments: {values: ['RETAIL', 'HNI', 'UHNI']}
      - name: primary_advisor_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_crm__advisor'), field: advisor_id}

  - name: stg_crm__meeting
    description: One row per CRM meeting, parsed from NDJSON. topics is kept as an ARRAY for stg_crm__meeting_topic.
    columns:
      - name: meeting_id
        data_tests: [unique, not_null]
      - name: meeting_channel
        data_tests:
          - accepted_values:
              arguments: {values: ['IN_PERSON', 'VIDEO', 'PHONE']}

  - name: stg_crm__meeting_topic
    description: Meeting topics exploded from the JSON array with LATERAL FLATTEN.
    data_tests:
      - unique:
          arguments: {column_name: "meeting_id || '-' || topic_seq"}
    columns:
      - name: meeting_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_crm__meeting'), field: meeting_id}
      - name: topic
        data_tests: [not_null]

  # ---------------------------------------------------------------- CORE
  - name: stg_core__account
    description: Latest version of each account (deduplicated on updated_at) with typed dates and upper-cased codes.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: account_status
        data_tests:
          - accepted_values:
              arguments: {values: ['ACTIVE', 'CLOSED']}

  - name: stg_core__account_holder
    description: Account-to-client ownership. ownership_pct converted to a 0-1 share; joint accounts have one row per holder.
    columns:
      - name: holder_role
        data_tests:
          - accepted_values:
              arguments: {values: ['PRIMARY', 'JOINT']}
      - name: ownership_share
        data_tests:
          - sums_to_one:
              arguments: {group_by: account_id}

  - name: stg_core__application_event
    description: Account-opening workflow events. One row per application and event type.
    columns:
      - name: event_type
        data_tests:
          - accepted_values:
              arguments: {values: ['APPLIED', 'KYC_SUBMITTED', 'KYC_APPROVED', 'ACCOUNT_OPENED', 'REJECTED']}

  # ---------------------------------------------------------------- OMS
  - name: stg_oms__transaction
    description: Deduplicated, typed trade + cash feed.
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: txn_type_code
        data_tests:
          - relationships:
              arguments: {to: ref('ref_transaction_type'), field: txn_type_code}
      - name: account_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_core__account'), field: account_id}
      - name: ticker
        description: Can reference a ticker missing from the security master (late-arriving dimension).
        data_tests:
          - relationships:
              arguments: {to: ref('stg_mkt__security'), field: ticker}
              config: {severity: warn}
      - name: quantity
        data_tests: [not_negative]

  # ---------------------------------------------------------------- MKT
  - name: stg_mkt__security
    description: Security master from JSON. Nested attributes flattened, NSE/BSE listings pivoted to columns. One row per ticker.
    columns:
      - name: ticker
        data_tests: [unique, not_null]

  - name: stg_mkt__price
    description: Daily OHLCV prices. One row per ticker and price date.
    columns:
      - name: close_price
        data_tests: [not_null, not_negative]
