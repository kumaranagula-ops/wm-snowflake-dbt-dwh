version: 2

models:
  - name: stg_clients
    description: One row per client, cleaned from raw_clients.
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: risk_profile
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONSERVATIVE', 'MODERATE', 'AGGRESSIVE']

  - name: stg_accounts
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_clients'), field: client_id}
      - name: account_status
        data_tests:
          - accepted_values:
              arguments: {values: ['ACTIVE', 'CLOSED']}

  - name: stg_securities
    columns:
      - name: ticker
        data_tests: [unique, not_null]

  - name: stg_prices
    columns:
      - name: close_price
        data_tests: [not_null, not_negative]

  - name: stg_transactions
    description: Deduplicated, typed trade feed with signed quantity and cash flow.
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: side
        data_tests:
          - accepted_values:
              arguments: {values: ['BUY', 'SELL']}
      - name: account_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_accounts'), field: account_id}
      - name: ticker
        data_tests:
          - relationships:
              arguments: {to: ref('stg_securities'), field: ticker}
      - name: quantity
        data_tests: [not_negative]
