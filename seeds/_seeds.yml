version: 2

seeds:
  - name: raw_transactions
    description: >
      Raw trade feed. Intentionally contains one duplicate txn_id and one row
      with a messy side value ('buy ') so staging logic has something to fix.
    config:
      column_types:
        txn_id: number
        price: number(18,4)
        fees: number(18,2)
        txn_ts: timestamp_ntz
  - name: raw_prices
    config:
      column_types:
        close_price: number(18,4)
        price_date: date
  - name: raw_clients
    config:
      column_types:
        updated_at: timestamp_ntz
