name: wm_micro
version: "2.0.0"
config-version: 2
require-dbt-version: [">=1.10.0", "<2.0.0"]
profile: wm_micro

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  lookback_hours: 6            # incremental safety window on _loaded_at (re-merges late/corrected rows)
  cntl_schema: CNTL            # where the native CNTL_* control tables live
  cntl_logging: true           # write every dbt run + test result into CNTL tables
  enable_governance: false     # true -> tag PII columns + row access policy (Enterprise, run labs/L09 first)

# ---- operational logging into the Snowflake control tables -----------------------
on-run-start:
  - "{{ cntl_log_run_start() }}"
on-run-end:
  - "{{ cntl_log_run_end(results) }}"

seeds:
  wm_micro:
    +schema: ref
    +quote_columns: false

snapshots:
  wm_micro:
    +schema: snapshots

models:
  wm_micro:
    +copy_grants: true                       # keep grants when dbt does CREATE OR REPLACE
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
      +transient: true                       # re-creatable work tables: no Fail-safe cost
    marts:
      +schema: marts
      +materialized: table
      +transient: false                      # permanent: Time Travel + Fail-safe
      +grants:
        select: ["WM_ANALYST"]
    share:
      +schema: share
      +materialized: view
      +secure: true                          # only secure views can be shared
      +grants:
        select: ["WM_ANALYST"]
