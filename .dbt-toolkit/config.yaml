# .dbt-toolkit/config.yaml
# Generated by dbt-toolkit setup wizard (2026-11-06).
version: 1

project:
  name: "wm_micro"
  dir: "."

execution:
  method: "local"            # dbt runs directly on this Mac (no Docker)
  dbt_bin: ".venv/bin/dbt"   # project virtualenv: dbt-core 1.12.5 + dbt-snowflake 1.12.1

profile:
  name: "wm_micro"
  target: "dev"
  profiles_dir: null          # null = ~/.dbt (default)

defaults:
  threads: 4
  full_refresh: false
  fail_fast: false
  log_format: "json"

freshness:
  enabled: true
  warn_after_hours: 24
  tracked_sources: []         # Empty = all sources

audit:
  check_sort_dist: false      # Redshift-only check; not applicable to Snowflake
  check_undocumented: true
  check_test_coverage: true
  min_test_coverage: 0.8

tags:
  favorites: []               # no tags used in this project yet
