name: dbt-snowflake

# Assumes the native Snowflake layer (snowflake/core/00-08) is already set up and RAW is loaded.
# dbt only transforms; loading is done by Snowflake itself (task graph / Snowpipe).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/rsa_key.p8
  DBT_PROFILES_DIR: ci

jobs:
  ci:
    # Pull request -> build + test everything in throw-away CI_<pr>_* schemas, then drop them
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DBT_CI_SCHEMA: CI_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Write private key
        run: |
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > rsa_key.p8
          chmod 600 rsa_key.p8
      - run: dbt debug --target ci
      - run: dbt source freshness --target ci || true      # report only
      - run: dbt build --target ci
      - name: Drop CI schemas
        if: always()
        run: dbt run-operation drop_schemas_with_prefix --args "{prefix: $DBT_CI_SCHEMA}" --target ci

  prod:
    # Merge to main (or manual run) -> build into STAGING / SNAPSHOTS / MARTS / SHARE
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Write private key
        run: |
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > rsa_key.p8
          chmod 600 rsa_key.p8
      - run: dbt build --target prod
      - run: dbt docs generate --target prod
